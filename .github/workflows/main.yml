name: make rules
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        run: |
          python3 -m venv .venv
          .venv/bin/python -c 'import sys; assert sys.version_info >= (3, 11)'
      - name: Test generator
        run: .venv/bin/python -m unittest discover -s tests -v

  update:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Generate and publish current rules
        run: |
          python3 -m venv .venv
          .venv/bin/python update.py
