name: make rules
on:
  pull_request:
  schedule:
    - cron: '0 0 * * *'
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        run: |
          python3 -m venv .venv
          .venv/bin/python -c 'import sys; assert sys.version_info >= (3, 11)'
      - name: Check static baseline
        run: |
          test "$(git ls-tree -r --name-only HEAD static | wc -l)" -eq 19
          test "$(git rev-parse HEAD:static)" = 7dcca27435e6de8b2f5085482cf67b1561884cf1
          git diff HEAD --exit-code -- static
          test -z "$(git ls-files --others -- static)"
      - name: Test generator
        run: .venv/bin/python -m unittest discover -s tests -v

  update:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate rules
        run: |
          python3 -m venv .venv
          .venv/bin/python generate.py
      - name: Check static and commit generated files
        run: |
          test "$(git ls-tree -r --name-only HEAD static | wc -l)" -eq 19
          test "$(git rev-parse HEAD:static)" = 7dcca27435e6de8b2f5085482cf67b1561884cf1
          git diff HEAD --exit-code -- static
          test -z "$(git ls-files --others -- static)"
          .venv/bin/python - <<'PY'
          import subprocess
          from pathlib import Path
          from formats import FILES
          from sources import load_config
          paths = [str(Path(group['name']) / name) for group in load_config(Path('.')) for name in FILES]
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Update generated rules'
            git push origin HEAD:main
          fi
