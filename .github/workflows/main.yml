name: make rules
on:
  pull_request:
  schedule:
    - cron: '17 22 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        run: |
          python3 -m venv .venv
          .venv/bin/python -c 'import sys; assert sys.version_info >= (3, 11)'
      - name: Check static baseline
        run: |
          test "$(git ls-tree -r --name-only HEAD static | wc -l)" -eq 18
          test "$(git rev-parse HEAD:static)" = 89e4626e07fc3e5d7833b4b9d87f535f596e6974
          git diff HEAD --exit-code -- static
          test -z "$(git ls-files --others -- static)"
      - name: Test generator
        run: .venv/bin/python -m unittest discover -s tests -v

  update:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate rules
        run: |
          python3 -m venv .venv
          .venv/bin/python generate.py
      - name: Check static and commit generated files
        run: |
          test "$(git ls-tree -r --name-only HEAD static | wc -l)" -eq 18
          test "$(git rev-parse HEAD:static)" = 89e4626e07fc3e5d7833b4b9d87f535f596e6974
          git diff HEAD --exit-code -- static
          test -z "$(git ls-files --others -- static)"
          for group in a1 a2 a3 cdn big-data dirt; do
            git add -- "$group/fin.txt" "$group/fin-qx.txt" "$group/fin.yaml" \
              "$group/fin-adb.txt" "$group/fin-surge.txt" "$group/fin-surge-ds.txt"
          done
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Update generated rules'
            git push origin HEAD:main
          fi
